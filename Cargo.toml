[package]
name = "thiserror"
version.workspace = true
authors.workspace = true
categories = ["rust-patterns", "no-std"]
description = "derive(Error)"
documentation = "https://docs.rs/thiserror"
edition.workspace = true
keywords = ["error", "error-handling", "derive"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]

# Std feature enables support for formatting std::path::{Path, PathBuf}
# conveniently in an error message.
#
#     #[derive(Error, Debug)]
#     #[error("failed to create configuration file {path}")]
#     pub struct MyError {
#         pub path: PathBuf,
#         pub source: std::io::Error,
#     }
#
# Without std, this would need to be written #[error("... {}", path.display())].
std = []

[dependencies]
thiserror-impl = { workspace = true }

[dev-dependencies]
anyhow.workspace = true
ref-cast.workspace = true
rustversion.workspace = true
trybuild = { workspace = true, features = ["diff"] }

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = [
    "--generate-link-to-definition",
    "--generate-macro-expansion",
    "--extern-html-root-url=core=https://doc.rust-lang.org",
    "--extern-html-root-url=alloc=https://doc.rust-lang.org",
    "--extern-html-root-url=std=https://doc.rust-lang.org",
]

# ═════════════════════════════════════════════════════════════════════════════
# Rust workspace manifest
# ─────────────────────────────────────────────────────────────────────────────
# Every crate under `crates/*` inherits the settings below via `*.workspace`
# references in their own Cargo.toml. Lint levels are enforced workspace-wide
# through `[workspace.lints.rust]` and `[workspace.lints.clippy]`.
#
# For an exhaustive reference of every rustc + clippy lint and every
# configurable key in clippy.toml, see:
#   - template-lint.toml    (every rust + clippy lint)
#   - template-clippy.toml  (every clippy.toml knob)
# ═════════════════════════════════════════════════════════════════════════════

[workspace]
members = ["impl", "tests/no-std", "xtask"]
resolver = "3"

# ─── Default metadata inherited by every member crate ───────────────────────
[workspace.package]
version      = "2.1.0"
edition      = "2024"
rust-version = "1.97"
license      = "MIT OR Apache-2.0"
license-file = "LICENSE-MIT or LICENSE-APACHE"
publish      = false
authors      = ["David Tolnay <dtolnay@gmail.com>", "Takumi Shimada <hello@takumi.earth>"]
repository   = "https://github.com/strict-rs/strict-thiserror"
readme       = "README.md"

# ─── Shared dependencies (populate here; members refer via `.workspace = true`) ─
[workspace.dependencies]
thiserror-impl = { version = "2.1.0", path = "impl" }
thiserror = { version = "2.1.0", path = ".", default-features = false }
anyhow = "1.0.73"
ref-cast = "1.0.18"
rustversion = "1.0.13"
quote = "1.0.35"

# `rust-template`'s template-level `AGENTS.md` agent guidance.
agents-md = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/agents-md-rs.git", branch = "main" }

# CLI — our maintained fork, tracking the `sync` branch (0.10.x). The `version`
# field constrains the git checkout so the dependency does not resolve to a `*`
# wildcard (cargo-deny `bans.wildcards = "deny"`).
bpaf = { git = "ssh://git@github.com/strict-rs/strict-bpaf.git", branch = "sync", version = "0.10", default-features = false }

# Engine — the language-agnostic xtask core (process/output/context, the core
# command registry + `Dispatch` seam, the `CommandIo` boundary).
strict-xtask-core = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-core-rs.git", branch = "main" }

# Rust/cargo gates — coverage, mutation, complexity, duplication, scaffolding,
# badges, cross, git hooks, and the cargo-metadata workspace resolver.
strict-xtask-cargo = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-cargo-rs.git", branch = "main" }

# Agent-guidance machinery — reusable generation engine.
strict-xtask-agents-md = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-xtask-agents-md-rs.git", branch = "main" }

# Panic-free test vocabulary, consumed as an external git crate, tracking the
# crate's main branch. The version requirement (kept in sync with the crate's own
# version) keeps it off cargo-deny's wildcard ban; `Cargo.lock` records the
# resolved commit, refreshed by `just update`.
strict-test-support = { version = "0.1.0", git = "ssh://git@github.com/earthlings-dev/strict-test-support-rs.git", branch = "main" }

# Source analysis — powers the `cq` cyclomatic-complexity gate in xtask.
# `span-locations` makes `proc_macro2::Span::start().line` meaningful outside a
# proc-macro (xtask parses files in a normal binary).
syn         = { version = "2", features = ["full", "visit"] }
proc-macro2 = { version = "1", features = ["span-locations"] }

# Workspace introspection — xtask uses `cargo metadata` (via this crate) to find
# the workspace root for `ensure_root` and to map a path operand to its owning
# crate for scoped commands, instead of hand-rolling manifest discovery.
cargo_metadata = "0.23"

# JSON — canonicalizes the `tokei` metrics report (sorts the per-file reports and
# keys) so the committed `cov/tokei.json` is byte-stable and its diffs mean
# something. `tokei` itself emits file reports in nondeterministic order.
serde_json = "1"

# Recursive file discovery — used by the generated-doc generator so nested
# template/consumer fragment trees are walked through a maintained library
# rather than custom directory traversal.
ignore = "0.4"

# Glob matching — powers metadata-driven agent gate rules from
# `[workspace.metadata.config.gates]`.
globset = "0.4"

# TOML — the badge generator derives policy badges (edition, toolchain channel,
# unsafe stance, duplication ceiling) from the workspace's own config files
# instead of hard-coding claims that could rot.
toml = "1.1"

# Lossless TOML editing — `update-template` updates only declared managed
# dependency keys while preserving consumer-owned manifest formatting/comments.
toml_edit = "0.25"

# Terminal styling — xtask uses semantic styles and renders ANSI only through a
# shared color policy.
anstyle = "1"

# Property testing — engine behind `strict_test_support::ensure_property`, used only
# through its Result-based core (`TestRunner::run`); the panicking `proptest!` /
# `prop_assert*` macro front doors are banned in clippy.toml. std-only: drops
# the fork/timeout features (and their rusty-fork/tempfile subtree).
proptest = { git = "ssh://git@github.com/strict-rs/strict-proptest.git", branch = "strict", version = "1.11", features = ["std"], default-features = false }

# Snapshot testing — engine behind `strict_test_support::ensure_snapshot`, used only
# through its Result-based core (`Assert::try_eq`). diff-only: the color
# features are compiled out so rendered diffs are deterministic plain text.
snapbox = { version = "1.2", features = ["diff"], default-features = false }

# Compile-diagnostics testing — engine behind `strict_test_support::ensure_compile_fail`
# / `ensure_compiles`, used only through its terminal-free `TestCases::try_run` core.
# Maintained fork, pinned as a direct git dependency (not crates.io + `[patch]`, which
# trybuild strips from the throwaway project it builds). The `version` field keeps it
# from resolving to a `*` wildcard once cargo-deny audits the all-features graph.
trybuild = { git = "ssh://git@github.com/strict-rs/strict-trybuild.git", branch = "strict", version = "1" }

# Synchronous mutex — backs the capturable `Output` sink in xtask so tests can
# capture semantic output instead of leaking it to the terminal. `std::sync`
# `Mutex`/`RwLock` are disallowed in clippy.toml ("prefer parking_lot in sync
# code"); xtask is fully synchronous, so the await-holding hazard never applies.
parking_lot = "0.12"

# ─── Release profile: small, fast, abort-on-panic ──────────────────────────
[profile.release]
lto              = "thin"
codegen-units    = 1
panic            = "abort"
strip            = "symbols"
opt-level        = 3
overflow-checks  = true
debug            = false
incremental      = false

# ─── Dev profile: fast incremental ─────────────────────────────────────────
[profile.dev]
debug            = "line-tables-only"
opt-level        = 0
overflow-checks  = true
incremental      = true

[profile.dev.package."*"]
# Optimise third-party deps in dev builds (their sources rarely change).
opt-level = 3

# ─── Test profile: overflow checks on, fast codegen ────────────────────────
[profile.test]
opt-level        = 0
overflow-checks  = true
debug            = true

[patch]

# ─── cargo-machete integration ─────────────────────────────────────────────
[workspace.metadata.cargo-machete]
# Deps intentionally unused in the workspace root can be listed here.
ignored = []

# ─── Template configuration metadata ───────────────────────────────────────
