empty_loop                               = "deny"
empty_drop                               = "deny"
empty_enums                              = "deny"
empty_structs_with_brackets              = "deny"
empty_enum_variants_with_brackets        = "deny"

# Force structured error handling
unwrap_used                              = "deny"
expect_used                              = "deny"
unwrap_in_result                         = "deny"
get_unwrap                               = "deny"
indexing_slicing                         = "deny"
string_slice                             = "deny"
map_err_ignore                           = "deny"
ok_expect                                = "deny"
error_impl_error                         = "deny"
result_large_err                         = "deny"

# Debug / "I'll remove this later" artefacts
dbg_macro                                = "deny"
print_stdout                             = "deny"
print_stderr                             = "deny"
use_debug                                = "deny"
verbose_file_reads                       = "deny"
