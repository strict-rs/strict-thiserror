[workspace.metadata.config.update]
schema-version   = "0.1.0"
lockfile-refresh = "just-update-when-managed-dependencies-change"

[workspace.metadata.config.update.opt-outs]
files    = []
defaults = []
keys     = []
elements = []

[[workspace.metadata.config.contract.lines]]
file = ".gitignore"
ownership = "template-with-consumer-entries"
required = [
  "/target/",
  "**/*.rs.bk",
