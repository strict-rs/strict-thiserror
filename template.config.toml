schema-version = "0.3.1"

[template]
id = "rust-template"

[template.source]
kind = "git"
url = "https://github.com/takumi-earth/rust-template.git"
branch = "main"

[ecosystems.cargo.layout]
kind = "flat"

[update.opt-outs]
files = []
defaults = []
# This fork exercises `anyhow` interoperability in its test suite. Keep these
# arrays target-owned so template updates preserve that test-only exception.
keys = [
  "clippy.toml:disallowed-macros",
  "clippy.toml:disallowed-methods",
  "clippy.toml:disallowed-types",
]
elements = []

[deviations.justfile]

[[deviations.justfile.recipes]]
file = "justfile"
name = "x"
reason = "strict-thiserror retains a repository-specific extension seam while standard workflows use the installed template binary"

[adoption]
completed-stage = "strict"
resolution = "live"
